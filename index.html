<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Math Survivor</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="hudLeft">
        <span id="waveText">Wave <b>1</b></span>
        <span id="trainingBadge" hidden>Training: <b id="trainingNum">—</b></span>
      </div>
      <div id="scoreHud">
        <span id="scoreValue">0</span>
      </div>
      <div id="hudRightAdd">
        <button id="charge" type="button" aria-label="bomb">
          <span class="ico">⚡</span>
          <span id="chargeVal">0/15</span>
        </button>
        <span id="lives" aria-label="lives"></span>
      </div>
    </div>
    <div id="xpBar"><div id="xpFill"></div></div>

    <div id="streak" hidden><span id="streakLabel">STREAK</span> <b id="streakValue">0</b><span id="streakMult">×2</span></div>

    <div id="waveAnnounce" hidden>WAVE 1</div>
    <div id="breather" hidden><div class="breatherLabel">NEXT WAVE</div><div class="breatherCount" id="breatherCount">3</div></div>
    <div id="bossAlert" hidden>BOSS!</div>

    <div id="paused" hidden>
      <h1>PAUSE</h1>
      <p>Press <kbd>Esc</kbd> to resume</p>
    </div>

    <div id="inputBox" hidden>
      <div id="inputValue">&nbsp;</div>
      <div id="inputLabel">ANSWER</div>
    </div>

    <div id="chipBar" hidden></div>

    <div id="startScreen">
      <h1>MATH SURVIVOR</h1>
      <p class="subtitle">Choose difficulty</p>
      <div class="diffOptions">
        <button class="diffBtn" data-diff="tresfacile">
          <span class="title">VERY EASY</span>
          <span class="key">1</span>
          <span class="row">Numbers up to 12</span>
          <span class="row">Yellow targets only</span>
          <span class="row">And a few pink</span>
        </button>
        <button class="diffBtn" data-diff="easy">
          <span class="title">EASY</span>
          <span class="key">2</span>
          <span class="row">Numbers up to 20</span>
          <span class="row">Few enemies</span>
          <span class="row">Gentle pace</span>
        </button>
        <button class="diffBtn" data-diff="medium">
          <span class="title">MEDIUM</span>
          <span class="key">3</span>
          <span class="row">Numbers up to 50</span>
          <span class="row">More enemies</span>
          <span class="row">Faster</span>
        </button>
        <button class="diffBtn" data-diff="hard">
          <span class="title">HARD</span>
          <span class="key">4</span>
          <span class="row">Numbers up to 100</span>
          <span class="row">Busy screen</span>
          <span class="row">Very fast</span>
        </button>
      </div>

      <div id="trainingSection">
        <h3>TRAINING (optional)</h3>
        <p>Pick one or more numbers, then choose a difficulty.</p>
        <div class="trainNumbers">
          <button class="trainBtn" data-num="1">1</button>
          <button class="trainBtn" data-num="2">2</button>
          <button class="trainBtn" data-num="3">3</button>
          <button class="trainBtn" data-num="4">4</button>
          <button class="trainBtn" data-num="5">5</button>
          <button class="trainBtn" data-num="6">6</button>
          <button class="trainBtn" data-num="7">7</button>
          <button class="trainBtn" data-num="8">8</button>
          <button class="trainBtn" data-num="9">9</button>
          <button class="trainBtn" data-num="10">10</button>
        </div>
      </div>
    </div>

    <div id="gameover" hidden>
      <h1>Game Over</h1>
      <p id="finalScore"></p>
      <div class="goBtns">
        <button id="restartBtn">Play again</button>
        <button id="changeDiffBtn">Change difficulty</button>
      </div>
      <p class="kbdHint">or press <kbd>R</kbd> to restart</p>
    </div>

    </div>
    <script src="./game.js"></script>
  </body>
</html>
