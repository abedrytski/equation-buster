<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a14" />
    <title>Equations Buster</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="stage">
    <canvas id="game"></canvas>
    <div id="topMask"></div>

    <div id="hud">
      <div id="hudLeft">
        <span id="waveText">Wave <b>1</b></span>
      </div>
      <div id="scoreHud">
        <span id="scoreValue">0</span>
      </div>
      <div id="hudRightAdd">
        <span id="lives" aria-label="lives"></span>
        <button id="muteBtn" type="button" aria-label="mute music">🔊</button>
      </div>
    </div>
    <div id="xpBar">
      <div id="xpFill"></div>
      <div class="waveTick tick1"></div>
      <div class="waveTick tick2"></div>
    </div>

    <div id="streak" hidden><span id="streakLabel">STREAK</span> <b id="streakValue">0</b><span id="streakMult">×2</span></div>

    <div id="waveAnnounce" hidden>WAVE 1</div>
    <div id="breather" hidden><div class="breatherLabel">NEXT WAVE</div><div class="breatherCount" id="breatherCount">3</div></div>
    <div id="bossAlert" hidden>BOSS!</div>

    <div id="paused" hidden>
      <h1>PAUSE</h1>
      <p>Press <kbd>Esc</kbd> to resume</p>
    </div>

    <div id="inputBox" hidden>
      <div id="inputValue">&nbsp;</div>
      <div id="inputLabel">ANSWER</div>
    </div>

    <div id="chipBar" hidden></div>

    <div id="startScreen">
      <h1>EQUATIONS BUSTER</h1>
      <button id="startBtn" type="button">START</button>
      <div id="diffPicker">
        <button class="diffBtn" data-diff="easy">EASY</button>
        <button class="diffBtn selected" data-diff="medium">MEDIUM</button>
        <button class="diffBtn" data-diff="hard">HARD</button>
      </div>
    </div>

    <div id="gameover" hidden>
      <h1>Game Over</h1>
      <p id="finalScore"></p>
      <div class="goBtns">
        <button id="restartBtn">Play again</button>
        <button id="changeDiffBtn">Change difficulty</button>
      </div>
      <p class="kbdHint">or press <kbd>R</kbd> to restart</p>
    </div>

    </div>
    <audio id="bgm" src="./music/background.mp3" loop preload="auto"></audio>
    <audio id="bossBgm" src="./music/boss.mp3" loop preload="auto"></audio>
    <script src="./game.js"></script>
  </body>
</html>
